# Build + publish a UniData package release on a self-hosted RedHat/Rocky
# runner, using the licensed udt-builder container.
# Copyright (C) 2026 Gordon Heydon.  GPL-2.0-only.
#
# Trigger it by hand (Actions -> udt release -> Run workflow) or call it from a
# package repo's own workflow (`uses: mvx-lang/mv-package-registry/.github/
# workflows/udt-release.yml@main`).  It checks out the package to build, then
# runs the udt-build action to produce and publish a source tar + a per-arch
# UniData binary tar.
name: udt release

on:
  workflow_dispatch:
    inputs:
      package_repo:
        description: "Package repo to build (owner/name), e.g. mvx-lang/udt_curses"
        required: true
      package_ref:
        description: "Ref/tag/branch of the package repo (blank = default branch)"
        required: false
        default: ""
      name:
        description: "Package name to publish, e.g. mv-lang/curses"
        required: true
      version:
        description: "Release version to cut, e.g. 1.0"
        required: true
      deps:
        description: "Dependencies (space-separated; fallback — mvpkg.json wins)"
        required: false
        default: ""
      description:
        description: "Description (fallback — mvpkg.json wins)"
        required: false
        default: ""
      license:
        description: "SPDX licence id to publish, e.g. GPL-2.0-only"
        required: false
        default: ""
  workflow_call:
    inputs:
      package_repo: { type: string, required: true }
      package_ref:  { type: string, required: false, default: "" }
      name:         { type: string, required: true }
      version:      { type: string, required: true }
      deps:         { type: string, required: false, default: "" }
      description:  { type: string, required: false, default: "" }
      license:      { type: string, required: false, default: "" }
    secrets:
      MVPKG_PUBLISH_TOKEN:
        description: "Registry publish token (empty for an open registry)."
        required: false
      PACKAGE_CHECKOUT_TOKEN:
        description: "Token to check out a private package repo (defaults to GITHUB_TOKEN)."
        required: false

jobs:
  release:
    # A self-hosted RedHat/Rocky runner that has Docker and the udt-builder
    # image — NOT a GitHub-hosted ubuntu runner.  Register the runner with the
    # `udt` label (Settings -> Actions -> Runners).
    runs-on: [self-hosted, linux, udt]
    steps:
      - name: Check out this registry (build-release.sh + publish.sh + the action)
        uses: actions/checkout@v4

      - name: Check out the package to build
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.package_repo }}
          ref: ${{ inputs.package_ref }}
          path: pkg
          token: ${{ secrets.PACKAGE_CHECKOUT_TOKEN || github.token }}
          submodules: recursive

      - name: Derive a filesystem-safe slug for the artifact name
        id: meta
        shell: bash
        run: echo "slug=$(printf '%s' '${{ inputs.name }}' | tr '/:@' '___')" >> "$GITHUB_OUTPUT"

      - name: Build + publish (udt-builder container)
        uses: ./.github/actions/udt-build
        with:
          name: ${{ inputs.name }}
          version: ${{ inputs.version }}
          package-path: ${{ github.workspace }}/pkg
          registry-path: ${{ github.workspace }}
          registry-url: ${{ vars.MVPKG_REGISTRY || 'https://mv-package.heydon.io' }}
          deps: ${{ inputs.deps }}
          description: ${{ inputs.description }}
          license: ${{ inputs.license }}
          publish-token: ${{ secrets.MVPKG_PUBLISH_TOKEN }}

      - name: Upload the release tars as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: udt-release-${{ steps.meta.outputs.slug }}-${{ inputs.version }}
          path: releases/*.tar.gz
          if-no-files-found: warn
