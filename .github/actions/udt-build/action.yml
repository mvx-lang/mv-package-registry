# mv-package-registry — build + publish a UniData binary release.
# Copyright (C) 2026 Gordon Heydon.  GPL-2.0-only.
#
# Runs the licensed `udt-builder` container on a self-hosted runner to build one
# package's UniData binary tar and attach it to the release.  It carries its own
# build-release.sh, so a caller in another repo needs only to check itself out.
#
#   # in a package repo's release workflow, on a self-hosted udt runner:
#   - uses: actions/checkout@v5
#   - uses: mvx-lang/mv-package-registry/.github/actions/udt-build@main
#     with:
#       package: mvx-lang/git      # base -> mvx-lang_git
#
# The package must provide `build-udt.sh`, which — run inside the container at
# the repo root — stages its release tree (contents at the root) into $1.
name: Build UniData binary release
description: Build one package's UniData binary tar in the udt-builder container and attach it to the release.

inputs:
  package:
    description: 'Package name, e.g. "mvx-lang/git". The artifact base is this with "/" -> "_".'
    required: true
  image:
    description: The udt-builder image on the runner.
    required: false
    default: udt-builder:8.3.2
  repository:
    description: 'Repo whose release to attach the asset to (owner/name); default this repo.'
    required: false
    default: ${{ github.repository }}
  token:
    description: GitHub token for the release upload.
    required: false
    default: ${{ github.token }}

outputs:
  tarball:
    description: The binary tarball filename.
    value: ${{ steps.build.outputs.tarball }}

runs:
  using: composite
  steps:
    - name: Set up the UniData toolchain (puts udt-run on PATH)
      uses: mvx-lang/mv-package-registry/.github/actions/setup-udt@main
      with:
        image: ${{ inputs.image }}

    - id: build
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
      run: sh "$GITHUB_ACTION_PATH/build-release.sh" "$PACKAGE"

    - name: Publish the UniData binary asset
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ inputs.token }}
        repository: ${{ inputs.repository }}
        tag_name: ${{ github.ref_name }}
        files: |
          ${{ steps.build.outputs.tarball }}
          ${{ steps.build.outputs.tarball }}.sha256
        fail_on_unmatched_files: true
