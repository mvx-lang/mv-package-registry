# mv_package registry — deploy on the hosting VM; fronted by the external
# Traefik (192.168.15.2), which routes BOTH packages.mvx-lang.org (the website,
# and the API for anything installed from now on) and mv-package.heydon.io (the
# API only, for clients and webhooks that predate the move) to the published
# port.  The old host answers a page request with a 301; see issue #55.
# GPL-2.0-only.
services:
  mvpkg-registry:
    build: .
    image: mvpkg-registry:latest
    container_name: mvpkg-registry
    restart: unless-stopped
    ports:
      - "8086:8080"                 # Traefik (external host) reaches this
    volumes:
      - ./data:/data                # published packages persist here
    environment:
      - MVPKG_PUBLISH_TOKEN=${MVPKG_PUBLISH_TOKEN:?set MVPKG_PUBLISH_TOKEN in .env}
      - MVPKG_ADMIN_USERS=${MVPKG_ADMIN_USERS:-}   # comma-separated admin usernames
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}             # admin:repo_hook — auto-installs release webhooks + reads mvpkg.json
      - WEB_ORIGIN=${WEB_ORIGIN:-}                 # website home, e.g. https://packages.mvx-lang.org
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-}           # origin baked into NEW webhook URLs + the GitHub App callback
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-}         # e.g. packages.mvx-lang.org
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-}       # e.g. https://packages.mvx-lang.org
      - TURNSTILE_SITEKEY=${TURNSTILE_SITEKEY:-}   # Cloudflare Turnstile (CAPTCHA), public
      - TURNSTILE_SECRET=${TURNSTILE_SECRET:-}     # Turnstile secret (server-side verify)
    networks:
      - proxy
networks:
  proxy:
    external: true
